name: Build GD Neural Pilot (Windows)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given   # uses "geode": "5.11.2" from mod.json
          bindings: geode-sdk/bindings
          bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e   # bindings at the v5.11.2 release

      - uses: actions/upload-artifact@v4
        with:
          name: demo.gd-neural-pilot
          path: ${{ steps.build.outputs.build-output }}
